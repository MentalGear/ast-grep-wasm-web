[package]
name = "sg-emscripten"
version = "0.1.0"
edition = "2021"
description = "ast-grep CLI compiled with Emscripten for WebContainer/browser environments"

[[bin]]
name = "sg"
path = "src/main.rs"

[dependencies]
ast-grep-core = { version = "0.40.5" }
ast-grep-language = { version = "0.40.5", default-features = false, features = [
  "tree-sitter-css",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-typescript",
  "tree-sitter-json",
  "tree-sitter-yaml",
] }
serde = { version = "1.0", features = [ "derive" ] }
serde_yaml = "0.9"
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
